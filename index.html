<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF AOC Meteo 气象业务工具站</title>
    <style>
        :root {
            --bg: #07111f;
            --panel: rgba(15, 23, 42, 0.86);
            --panel-strong: rgba(30, 41, 59, 0.94);
            --line: rgba(148, 163, 184, 0.22);
            --text: #e5edf7;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.16), transparent 28%),
                radial-gradient(circle at 82% 18%, rgba(34, 197, 94, 0.13), transparent 25%),
                linear-gradient(135deg, #07111f 0%, #0f172a 48%, #111827 100%);
            color: var(--text);
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .site-shell {
            width: min(1180px, calc(100vw - 32px));
            min-height: 100vh;
            margin: 0 auto;
            padding: 28px 0 34px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid var(--line);
            border-radius: 8px;
            backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand-mark {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: .08em;
        }

        .brand-sub {
            color: var(--muted);
            font-size: 13px;
        }

        .hero-main {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }

        .hero-main {
            padding: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 5vw, 54px);
            line-height: 1.05;
            letter-spacing: 0;
        }

        .hero-copy {
            margin: 0;
            max-width: 620px;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
        }

        .tile-grid {
            display: grid;
            grid-template-columns: 1.15fr .95fr .9fr;
            grid-auto-rows: minmax(190px, auto);
            gap: 14px;
        }

        .tool-tile {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 170px;
            padding: 20px;
            color: var(--text);
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid rgba(226, 232, 240, 0.16);
            background: var(--panel-strong);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.24);
            transform: translateY(0);
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        .tool-tile:hover {
            transform: translateY(-5px);
            border-color: rgba(125, 211, 252, 0.55);
            box-shadow: 0 22px 42px rgba(0, 0, 0, 0.32);
        }

        .tool-tile::after {
            content: "";
            position: absolute;
            inset: auto -20% -42% 32%;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,.18), transparent 64%);
            pointer-events: none;
        }

        .tile-forecast { background: linear-gradient(135deg, rgba(14, 165, 233, .95), rgba(15, 23, 42, .94)); }
        .tile-trend { background: linear-gradient(135deg, rgba(34, 197, 94, .9), rgba(15, 23, 42, .94)); }
        .tile-sun { background: linear-gradient(135deg, rgba(245, 158, 11, .92), rgba(15, 23, 42, .94)); }

        .tile-kicker {
            color: rgba(255, 255, 255, 0.74);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .tile-title {
            margin: 16px 0 6px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0;
        }

        .tile-desc {
            margin: 0;
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
            line-height: 1.55;
        }

        .tile-meta {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
        }

        .tile-arrow {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            font-size: 20px;
        }

        .footer-note {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.7;
            padding: 0 2px;
        }

        @media (max-width: 900px) {
            .tile-grid { grid-template-columns: 1fr; }
            .topbar { align-items: flex-start; flex-direction: column; }
        }

        @media (max-width: 560px) {
            .site-shell { width: min(100vw - 20px, 1180px); padding-top: 12px; }
            .hero-main, .tool-tile { padding: 18px; }
            .brand-mark { font-size: 17px; }
            .tile-title { font-size: 21px; }
        }
    </style>
</head>
<body>
    <main class="site-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">SF AOC METEO</div>
                <div class="brand-sub">机场气象业务工具站</div>
            </div>
        </header>

        <section class="hero-main" aria-label="网站说明">
            <h1>气象业务工具入口</h1>
            <p class="hero-copy">选择一个工具开始查询。结果仅供气象值班、趋势研判和运行参考。</p>
        </section>

        <section class="tile-grid" aria-label="工具入口">
            <a class="tool-tile tile-forecast" href="./index1">
                <div>
                    <div class="tile-kicker">0-7D ECMWF</div>
                    <h2 class="tile-title">精细化机场预报</h2>
                    <p class="tile-desc">未来 7 天逐小时机场天气要素。</p>
                </div>
                <div class="tile-meta"><span>进入工作台</span><span class="tile-arrow">›</span></div>
            </a>

            <a class="tool-tile tile-trend" href="./index2">
                <div>
                    <div class="tile-kicker">Multi-Scale</div>
                    <h2 class="tile-title">多尺度趋势研判</h2>
                    <p class="tile-desc">集合、延伸期、季节和气候参考。</p>
                </div>
                <div class="tile-meta"><span>查看趋势</span><span class="tile-arrow">›</span></div>
            </a>

            <a class="tool-tile tile-sun" href="./index3">
                <div>
                    <div class="tile-kicker">Sunlight</div>
                    <h2 class="tile-title">日照与昼夜节律</h2>
                    <p class="tile-desc">全年日出日落、昼长和 UTC/LT。</p>
                </div>
                <div class="tile-meta"><span>打开日照表</span><span class="tile-arrow">›</span></div>
            </a>
        </section>

        <footer class="footer-note">
            数据来源：Open-Meteo、mwgg/Airports、SunCalc、Apache ECharts。结果仅供气象值班、趋势研判和运行参考。
        </footer>
    </main>
</body>
</html>
